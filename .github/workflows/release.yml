name: Release

# Builds a fully static (musl) Linux binary and a Windows (MSVC) binary. Pushing a tag like
# `v0.1.0` publishes them as a GitHub release; running the workflow manually only uploads the
# binaries as build artifacts.
on:
  push:
    tags: [ 'v*' ]
    branches: [ 'windows-binary' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Linux (x86_64-musl)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
    - uses: actions/checkout@v5
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    # zig serves as the C/C++ cross compiler: harfbuzz is compiled from its bundled source and
    # needs a C++ toolchain targeting musl. fontconfig can't be linked statically, so it is
    # turned off with --no-default-features.
    - name: Install zig and cargo-zigbuild
      run: pip install ziglang==0.17.1 cargo-zigbuild==0.24.1
    - name: Build
      run: cargo zigbuild --release --locked --no-default-features --target "$TARGET"
    - name: Check that the binary is static
      run: |
        file "target/$TARGET/release/helium"
        ! ldd "target/$TARGET/release/helium"
    - name: Smoke test
      run: |
        "target/$TARGET/release/helium" tests/documents/book.html book.pdf
        test -s book.pdf
    - name: Package
      id: package
      run: |
        name="helium-${GITHUB_REF_NAME//\//-}-$TARGET"
        mkdir "$name"
        cp "target/$TARGET/release/helium" resources/fonts/LICENSE-DejaVu.txt "$name/"
        tar czf "$name.tar.gz" "$name"
        sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
        echo "name=$name" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.name }}.tar.gz*
    - name: Publish release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" --generate-notes \
          "${{ steps.package.outputs.name }}.tar.gz" "${{ steps.package.outputs.name }}.tar.gz.sha256"

  windows:
    name: Windows (x86_64-msvc)
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TARGET: x86_64-pc-windows-msvc
      # harfbuzz-subset.cc has more sections than MSVC's default object format allows
      CFLAGS: /bigobj
      CXXFLAGS: /bigobj
    steps:
    - uses: actions/checkout@v5
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    - name: Set up the MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    # harfbuzz is compiled from its bundled source and needs the MSVC C++ toolchain. Windows
    # finds its fonts through fontdb's directory scan, so fontconfig stays off.
    - name: Build
      run: |
        cargo build --release --locked --no-default-features --target "$env:TARGET" 2>&1 | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) {
          $tail = (Get-Content build.log -Tail 25) -join '%0A'
          Write-Output "::error title=windows build::$tail"
          exit 1
        }
    - name: Smoke test
      run: |
        & "target/$env:TARGET/release/helium.exe" tests/documents/book.html book.pdf
        if (-not (Test-Path book.pdf) -or (Get-Item book.pdf).Length -eq 0) { throw "no PDF written" }
    - name: Package
      id: package
      run: |
        $name = "helium-" + ($env:GITHUB_REF_NAME -replace '/', '-') + "-$env:TARGET"
        New-Item -ItemType Directory "$name" | Out-Null
        Copy-Item "target/$env:TARGET/release/helium.exe", "resources/fonts/LICENSE-DejaVu.txt" "$name"
        Compress-Archive -Path "$name" -DestinationPath "$name.zip"
        $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
        "$hash  $name.zip" | Out-File -FilePath "$name.zip.sha256" -Encoding ascii -NoNewline
        "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.name }}
        path: ${{ steps.package.outputs.name }}.zip*
    - name: Upload to the release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "$env:GITHUB_REF_NAME" "${{ steps.package.outputs.name }}.zip" "${{ steps.package.outputs.name }}.zip.sha256" --clobber
