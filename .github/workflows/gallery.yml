name: Gallery

# Renders the documents in gallery/ to PDF on every push to master, and publishes them (with
# thumbnails) to GitHub Pages. It can also be started by hand for another branch (Actions -> Gallery
# -> Run workflow), and then the rendered site is only uploaded as a workflow artifact, which
# still catches documents that stop rendering.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    # fontconfig: Umbruch's default features. poppler-utils: thumbnails and page counts.
    # Most documents use only the fonts built into Umbruch. The poster asks for the installed
    # fonts (`gallery-fonts: system`) and needs about 115 more, which its script downloads.
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev poppler-utils
    - name: Cache the fonts of the poster
      id: poster-fonts
      uses: actions/cache@v4
      with:
        path: ~/.fonts/umbruch-poster
        key: poster-fonts-${{ hashFiles('gallery/poster/fetch-fonts.sh') }}
    - name: Download the fonts of the poster
      if: steps.poster-fonts.outputs.cache-hit != 'true'
      run: sh gallery/poster/fetch-fonts.sh
    # Optional: Mongolian Title comes from a third-party site over HTTP and is checked against
    # a checksum. The script never fails the job; without the font Mongolian uses Noto Sans.
    # It runs on a cache hit too, so that a failed download is retried on the next run.
    - name: Download the Mongolian font of the poster
      run: sh gallery/poster/fetch-mongolian-font.sh
    - name: Index the fonts of the poster
      run: fc-cache -f ~/.fonts/umbruch-poster
    # The typography specimen is set in EB Garamond, which is not built into Umbruch.
    - name: Cache the font of the typography specimen
      id: typography-fonts
      uses: actions/cache@v4
      with:
        path: ~/.fonts/umbruch-typography
        key: typography-fonts-${{ hashFiles('gallery/typography/fetch-fonts.sh') }}
    - name: Download the font of the typography specimen
      if: steps.typography-fonts.outputs.cache-hit != 'true'
      run: sh gallery/typography/fetch-fonts.sh
    - name: Index the font of the typography specimen
      run: fc-cache -f ~/.fonts/umbruch-typography
    - name: Build
      run: cargo build --release --locked
    - name: Render the gallery
      run: python3 gallery/build.py --umbruch target/release/umbruch --out _site
    - uses: actions/upload-artifact@v4
      with:
        name: gallery
        path: _site
    - name: Upload the site for Pages
      if: github.ref == 'refs/heads/master'
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
