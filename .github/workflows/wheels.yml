name: Python wheels

# Wheels of the `umbruch` executable for PyPI (package `umbruch`).  Pushing a tag like `v0.5.1`
# builds all wheels and publishes them with PyPI trusted publishing; a manual run only uploads
# the wheels as build artifacts.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ x86_64, aarch64 ]
    steps:
    - uses: actions/checkout@v5
    # zig is the C/C++ cross compiler for harfbuzz, as in release.yml; manylinux 2_17 keeps the
    # wheels installable on old distributions.
    - uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: 2_17
        args: --release --locked --out dist --zig
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-${{ matrix.target }}
        path: dist

  musllinux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [ x86_64, aarch64 ]
    steps:
    - uses: actions/checkout@v5
    - uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        manylinux: musllinux_1_2
        args: --release --locked --out dist --zig
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-musllinux-${{ matrix.target }}
        path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [ x86_64-apple-darwin, aarch64-apple-darwin ]
    steps:
    - uses: actions/checkout@v5
    - uses: PyO3/maturin-action@v1
      with:
        target: ${{ matrix.target }}
        args: --release --locked --out dist
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-macos-${{ matrix.target }}
        path: dist

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v5
    - uses: PyO3/maturin-action@v1
      with:
        target: x86_64
        args: --release --locked --out dist
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-windows
        path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    - uses: actions/upload-artifact@v4
      with:
        name: wheels-sdist
        path: dist

  # Installs the wheel built for this runner into a clean environment and renders a page.
  test:
    needs: [ linux ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist
    - run: |
        python -m venv venv
        venv/bin/pip install dist/*.whl
        venv/bin/python -c "import umbruch; print(umbruch.find_umbruch())"
        venv/bin/umbruch tests/documents/book.html book.pdf
        test -s book.pdf
        printf 'Content-Length: 33\r\n\r\n{"id":1,"op":"hello","params":{}}' | venv/bin/umbruch --serve | head -c 200

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ linux, musllinux, macos, windows, sdist, test ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
