name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libfontconfig1-dev fonts-stix fonts-lmodern poppler-utils
    - name: Build
      run: cargo build --verbose
    - name: Install veraPDF
      run: tools/fetch_verapdf.sh "$RUNNER_TEMP/verapdf"
    - name: Run tests
      run: cargo test --verbose
      env:
        # tests/conformance.rs validates the gallery for PDF/A and PDF/UA-1 with veraPDF
        VERAPDF_LIB: ${{ runner.temp }}/verapdf/lib
    # the engine must keep building for the browser (umbruch_wasm); no wasm-bindgen CLI needed to check
    - name: Check the WebAssembly build
      run: |
        rustup target add wasm32-unknown-unknown
        cargo check --locked --target wasm32-unknown-unknown --manifest-path umbruch_wasm/Cargo.toml
