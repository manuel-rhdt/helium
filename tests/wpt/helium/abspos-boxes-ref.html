<!DOCTYPE html>
<title>Reference for abspos-boxes</title>
<style>
  body { margin: 0; }
  /* The padding box of #outer is 110px x 70px at (32px, 42px) so #inner ends up at (122px, 102px) */
  #outer { margin: 40px 0 0 30px; width: 100px; height: 60px; padding: 5px; border: 2px solid black; background: green; }
  #inner { margin: -12px 0 0 122px; width: 20px; height: 10px; background: blue; }
</style>
<div id="outer"></div>
<div id="inner"></div>
