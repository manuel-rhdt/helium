<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:A4;margin:10mm}
body{margin:0;font:10pt sans-serif;background:#e8e8e8}
.b{width:230px;height:120px;margin:0 0 8px 0;border:3px solid #000;border-radius:14px}
.m{background-color:#ffd54a;background-image:linear-gradient(90deg,#f00,#00f);background-blend-mode:multiply}
.d{background-color:#2a7;background-image:linear-gradient(0deg,#fff,#000);background-blend-mode:difference}
.s{background-color:#124;background-image:radial-gradient(circle,#f80,#f80 0,#0000 70%),linear-gradient(90deg,#0f8,#80f);background-blend-mode:screen,overlay}
.n{background-color:#ffd54a;background-image:linear-gradient(90deg,#f00,#00f)}
.sq{border-radius:0;background-color:#fc0;background-image:conic-gradient(#f00,#00f,#f00);background-blend-mode:hard-light}
</style></head><body>
<div class="b n"></div><div class="b m"></div><div class="b d"></div><div class="b s"></div><div class="b sq"></div>
</body></html>
