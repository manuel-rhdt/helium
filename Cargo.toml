[package]
name = "helium"
version = "0.4.0"
authors = ["Manuel Reinhardt"]
edition = "2024"

[dependencies]
serde_json = "1.0.154"
flate2 = "1"
structopt = ">= 0.2"
derive_more = { version = "*", features = ["full"] }
fontdb = "0.24"
html5ever = "0.40"
xml5ever = "0.40"
log = { version = "0.4.8", features = ["std", "max_level_trace", "release_max_level_trace"] }
cssparser = "0.38"
selectors = "0.41"
specs = { version = "0.20", features = ["shred-derive", "specs-derive"] }
helium_derive = { path = "./helium_derive" }
helium_paginate = { path = "./helium_paginate" }
lemon_pdf = { git = "https://github.com/manuel-rhdt/lemon_pdf.git", branch = "master" }
lemon_pdf_derive = { git = "https://github.com/manuel-rhdt/lemon_pdf.git", branch = "master" }
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main", features = ["sys"] }
formel = "0.1.0"
parking_lot = "0.11"
thiserror = "^1"
env_logger = "0.8"
cssparser-color = "0.6"
precomputed-hash = "0.1"
smallvec = "1.16.3"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
unicode-bidi = "0.3"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "float_layout", "content_size", "calc", "detailed_layout_info"] }
icu_segmenter = "2.4"
unicode-script = "0.5.9"
unicode-vo = "0.1"
unicode-segmentation = "1.13.3"
ttf-parser = { version = "0.25.1", default-features = false, features = ["glyph-names", "std", "variable-fonts"] }
usvg = { path = "svg" }
png = "0.18.1"
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }

# Finding an installed font for characters that the fonts of `font-family` lack
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
yeslogic-fontconfig-sys = { version = "6", optional = true }

[features]
default = ["fontconfig"]
# Ask fontconfig for the default generic families and for fallback fonts on Linux/BSD. Disable
# for fully static (musl) builds, which can't link the system's fontconfig; installed fonts are
# then found by scanning the font directories only.
fontconfig = ["dep:yeslogic-fontconfig-sys"]

[dev-dependencies]
assert_cmd = "1"
predicates = "1"
quickcheck = "1"
quickcheck_macros = "1"

[build-dependencies]
fontdb = { version = "0.24", default-features = false, features = ["std"] }
flate2 = "1"
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main", features = ["sys"] }

# Make every crate in the graph (e.g. formel) use the same harfbuzz_rs,
# since only one package may link to native harfbuzz.
[patch.crates-io]
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main" }
# `MathTree::token_content`, for foreign content (an image) inside `<mtext>`. Drop this once it is released.
formel = { git = "https://github.com/manuel-rhdt/formel.git", branch = "master" }

# The build script subsets the bundled fonts; do not run harfbuzz unoptimized.
[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
