[package]
name = "umbruch"
version = "0.5.3"
authors = ["Manuel Reinhardt"]
edition = "2024"

[dependencies]
serde_json = "1.0.154"
flate2 = "1"
structopt = ">= 0.2"
derive_more = { version = "*", features = ["full"] }
fontdb = "0.24"
html5ever = "0.40"
xml5ever = "0.40"
log = { version = "0.4.8", features = ["std", "max_level_trace", "release_max_level_trace"] }
cssparser = "0.38"
selectors = "0.41"
specs = { version = "0.20", features = ["shred-derive", "specs-derive"] }
umbruch_derive = { path = "./umbruch_derive" }
umbruch_paginate = { path = "./umbruch_paginate" }
rustc-hash = "2"
lemon_pdf = { git = "https://github.com/manuel-rhdt/lemon_pdf.git", branch = "claude/cidset" }
lemon_pdf_derive = { git = "https://github.com/manuel-rhdt/lemon_pdf.git", branch = "claude/cidset" }
harfrust = "0.16"
# Subsets the fonts for embedding into PDFs (`build.rs` subsets the bundled fonts with skera).
subsetter = { version = "0.2", default-features = false }
read-fonts = "0.47"
formel = "0.2"
parking_lot = "0.11"
thiserror = "^1"
env_logger = "0.8"
cssparser-color = "0.6"
precomputed-hash = "0.1"
smallvec = "1.16.3"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
unicode-bidi = "0.3"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "float_layout", "content_size", "calc", "detailed_layout_info"] }
icu_segmenter = "2.4"
unicode-script = "0.5.9"
unicode-vo = "0.1"
unicode-segmentation = "1.13.3"
usvg = { path = "svg" }
png = "0.18.1"
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji", "general-category"] }

# Finding an installed font for characters that the fonts of `font-family` lack
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
yeslogic-fontconfig-sys = { version = "6", optional = true }

[features]
default = ["fontconfig", "embedded-fonts"]
# Ask fontconfig for the default generic families and for fallback fonts on Linux/BSD. Disable
# for fully static (musl) builds, which can't link the system's fontconfig; installed fonts are
# then found by scanning the font directories only.
fontconfig = ["dep:yeslogic-fontconfig-sys"]
# Build in the Noto fonts for the scripts that DejaVu Sans lacks (Arabic, Indic, South-East Asian,
# ...), symbols, colour emoji and CJK: about 18 MB of the binary, mostly CJK. Without it the TeX
# Gyre and math fonts and DejaVu Sans are still built in; text in the other scripts then needs
# fonts that are installed or that the document brings with `@font-face`.
embedded-fonts = []

[dev-dependencies]
skera = "0.10"
assert_cmd = "1"
predicates = "1"
quickcheck = "1"
quickcheck_macros = "1"

[build-dependencies]
fontdb = { version = "0.24", default-features = false, features = ["std"] }
flate2 = "1"
read-fonts = "0.47"
skera = "0.10"

# The build script subsets the bundled fonts; do not run the subsetter unoptimized.
[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
