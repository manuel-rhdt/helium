[package]
name = "helium"
version = "0.1.0"
authors = ["Manuel Reinhardt"]
edition = "2018"

[dependencies]
structopt = "0.2.18"
derive_more = "^0.99"
font-kit = "0.6.0"
html5ever = "0.23.0"
log = "0.4.6"
simple_logger = "1.3.0"
cssparser = "0.25.6"
selectors = "0.21.0"
specs = { version = "0.15.0", features = ["shred-derive", "specs-derive"] }
helium_derive = { path = "./helium_derive" }
lemon_pdf = { git = "https://github.com/manuel-rhdt/lemon_pdf.git" }
font_parse = { git = "https://github.com/manuel-rhdt/font_parse" }
arrayvec = "^0.5"

[dev-dependencies]
assert_cmd = "0.11.1"
predicates = "1.0.1"
quickcheck = "0.8.5"
quickcheck_macros = "0.8.0"

[build-dependencies]
quote = "1"
Inflector = "0.11.4"
proc-macro2 = "1"
