[package]
name = "helium"
version = "0.1.0"
authors = ["Manuel Reinhardt"]
edition = "2024"

[dependencies]
structopt = ">= 0.2"
derive_more = { version = "*", features = ["full"] }
font-kit = "0.8.0"
html5ever = "0.40"
log = { version = "0.4.8", features = ["std", "max_level_trace", "release_max_level_trace"] }
cssparser = "0.38"
selectors = "0.41"
specs = { version = "0.20", features = ["shred-derive", "specs-derive"] }
helium_derive = { path = "./helium_derive" }
lemon_pdf = { git = "https://github.com/manuel-rhdt/lemon_pdf.git" }
lemon_pdf_derive = { git = "https://github.com/manuel-rhdt/lemon_pdf.git" }
font_parse = { git = "https://github.com/manuel-rhdt/font_parse" }
harfbuzz_rs = { version = "^3.0.1", features = ["sys"] }
math-render = { path = "../mlayout" }
parking_lot = "0.11"
thiserror = "^1"
env_logger = "0.8"
pest = "2.8.0"
pest_derive = "2.8.0"
rustyline = "16"
cssparser-color = "0.6"
precomputed-hash = "0.1"
imbl = "7"

[dev-dependencies]
assert_cmd = "1"
predicates = "1"
quickcheck = "1"
quickcheck_macros = "1"
serde_json = "1.0.154"

[build-dependencies]
quote = "1"
Inflector = ">= 0.11"
proc-macro2 = "1"
