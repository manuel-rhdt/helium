[package]
name = "helium"
version = "0.1.3"
authors = ["Manuel Reinhardt"]
edition = "2024"

[dependencies]
structopt = ">= 0.2"
derive_more = { version = "*", features = ["full"] }
fontdb = "0.24"
html5ever = "0.40"
log = { version = "0.4.8", features = ["std", "max_level_trace", "release_max_level_trace"] }
cssparser = "0.38"
selectors = "0.41"
specs = { version = "0.20", features = ["shred-derive", "specs-derive"] }
helium_derive = { path = "./helium_derive" }
lemon_pdf = { git = "https://github.com/manuel-rhdt/lemon_pdf.git" }
lemon_pdf_derive = { git = "https://github.com/manuel-rhdt/lemon_pdf.git" }
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main", features = ["sys"] }
math-render = { git = "https://github.com/manuel-rhdt/mlayout" }
parking_lot = "0.11"
thiserror = "^1"
env_logger = "0.8"
pest = "2.8.0"
pest_derive = "2.8.0"
rustyline = "16"
cssparser-color = "0.6"
precomputed-hash = "0.1"
imbl = "7"
smallvec = "1.16.3"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
unicode-bidi = "0.3"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "block_layout", "flexbox", "grid", "float_layout", "content_size", "calc", "detailed_layout_info"] }
unicode-linebreak = "0.1"
unicode-script = "0.5.9"
unicode-segmentation = "1.13.3"

# Finding an installed font for characters that the fonts of `font-family` lack
[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "ios")))'.dependencies]
yeslogic-fontconfig-sys = { version = "6", optional = true }

[features]
default = ["fontconfig"]
# Ask fontconfig for the default generic families and for fallback fonts on Linux/BSD. Disable
# for fully static (musl) builds, which can't link the system's fontconfig; installed fonts are
# then found by scanning the font directories only.
fontconfig = ["dep:yeslogic-fontconfig-sys"]

[dev-dependencies]
assert_cmd = "1"
predicates = "1"
quickcheck = "1"
quickcheck_macros = "1"
serde_json = "1.0.154"
flate2 = "1"
ttf-parser = { version = "0.25.1", default-features = false, features = ["glyph-names", "std"] }

[build-dependencies]
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main", features = ["sys"] }

# Make every crate in the graph (e.g. math-render) use the same harfbuzz_rs,
# since only one package may link to native harfbuzz.
[patch.crates-io]
harfbuzz_rs = { git = "https://github.com/harfbuzz/harfbuzz_rs.git", branch = "main" }

# The build script subsets the bundled fonts; do not run harfbuzz unoptimized.
[profile.dev.build-override]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
