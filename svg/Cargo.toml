[package]
name = "usvg"
version = "0.50.0"
edition = "2024"
rust-version = "1.85.0"
description = "A fork of usvg 0.50 (https://github.com/linebender/resvg) that reads the DOM of Helium."
license = "Apache-2.0 OR MIT"
publish = false

# The library keeps its name, so that the rest of Helium does not change.
[lib]
name = "usvg"
path = "src/lib.rs"

[features]
default = ["svgz", "text", "writer"]
svgz = ["flate2"]
text = ["fontdb", "harfrust", "skrifa", "unicode-bidi", "unicode-script", "unicode-vo", "writer"]
writer = ["xmlwriter", "base64"]

[dependencies]
data-url = "0.3"
imagesize = "0.15.0"
kurbo = "0.13.0"
log = "0.4"
roxmltree = "0.21.1"
simplecss = "0.2"
siphasher = "1.0"
strict-num = "0.1.1"
svgtypes = "0.16.2"
tiny-skia-path = "0.12.0"
fontdb = { version = "0.24", default-features = false, optional = true }
harfrust = { version = "0.15.0", optional = true }
skrifa = { version = "0.49.0", default-features = false, features = ["std"], optional = true }
unicode-bidi = { version = "0.3", optional = true }
unicode-script = { version = "0.5", optional = true }
unicode-vo = { version = "0.1", optional = true }
base64 = { version = "0.23", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
xmlwriter = { version = "0.1", optional = true }
